name: Backend CI

on:
  push:
    branches:
      - main
      - 'feature-*'
      - 'feature/**'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eks-demo-backend
  GITOPS_REPOSITORY: rabi-ram/eks-demo-gitops
  GITOPS_FILE: apps/backend/deployment.yaml

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install Test Dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements-test.txt

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          AWS_REGION: ap-south-1
          S3_BUCKET: unit-test-bucket
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python -m pytest -v

      - name: Build Backend Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eks-demo-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push SHA-Tagged Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Pushed image: $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Create GitOps Pull Request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GITOPS_TOKEN secret is not configured."
            exit 1
          fi

          gh auth setup-git
          git clone "https://github.com/${GITOPS_REPOSITORY}.git" gitops
          cd gitops

          BRANCH="update-backend-${IMAGE_TAG}"
          git checkout -b "$BRANCH"

          export IMAGE
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("apps/backend/deployment.yaml")
          text = path.read_text()
          lines = text.splitlines(keepends=True)

          matches = [
              i for i, line in enumerate(lines)
              if line.lstrip().startswith("image:")
              and "eks-demo-backend" in line
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one eks-demo-backend image line; found {len(matches)}"
              )

          index = matches[0]
          newline = "\n" if lines[index].endswith("\n") else ""
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = f"{indent}image: {os.environ['IMAGE']}{newline}"
          path.write_text("".join(lines))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_FILE"

          if git diff --cached --quiet; then
            echo "No GitOps changes required."
            exit 0
          fi

          git commit -m "Update backend image to ${IMAGE_TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GITOPS_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Update backend image to ${IMAGE_TAG}" \
            --body "Automated backend image update from application commit ${GITHUB_SHA}. Review and merge this pull request to deploy through Argo CD."
